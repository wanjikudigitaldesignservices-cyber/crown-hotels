<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFC25E" />
      <stop offset="50%" stop-color="#C9A227" />
      <stop offset="100%" stop-color="#9E7B15" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0B1F3A" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background Shield or Circle -->
  <rect width="100" height="100" rx="22" fill="#0B1F3A" />
  
  <!-- Crown Element -->
  <g filter="url(#subtleGlow)">
    <!-- Crown Base Band -->
    <path d="M 24 64 L 76 64 C 76 64 74 69 50 69 C 26 69 24 64 24 64 Z" fill="url(#goldGrad)" />
    <!-- Jewels on Base Band -->
    <circle cx="34" cy="66.5" r="1.5" fill="#FAF6EC" />
    <circle cx="50" cy="66.5" r="2" fill="#FAF6EC" />
    <circle cx="66" cy="66.5" r="1.5" fill="#FAF6EC" />
    
    <!-- Crown Peaks -->
    <path d="M 24 62 L 20 40 L 35 50 L 50 28 L 65 50 L 80 40 L 76 62 Z" fill="url(#goldGrad)" stroke="#C9A227" stroke-width="0.5" />
    
    <!-- Finial Jewels -->
    <circle cx="20" cy="38" r="3" fill="#FAF6EC" stroke="#C9A227" stroke-width="1.2" />
    <circle cx="35" cy="48" r="2.5" fill="#FAF6EC" stroke="#C9A227" stroke-width="1.2" />
    <circle cx="50" cy="25" r="3.8" fill="#FAF6EC" stroke="#C9A227" stroke-width="1.5" />
    <circle cx="65" cy="48" r="2.5" fill="#FAF6EC" stroke="#C9A227" stroke-width="1.2" />
    <circle cx="80" cy="38" r="3" fill="#FAF6EC" stroke="#C9A227" stroke-width="1.2" />
  </g>
</svg>
